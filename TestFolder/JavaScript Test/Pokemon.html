<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poké-Navigator</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>

    <div id="pokedex-container">
        <aside id="pokemon-list">
            <h3>Pokémon List</h3>
            <ul id="list-items"></ul>
        </aside>

        <main id="pokemon-details">
            <div id="card">
                <h2 id="poke-name">Select a Pokémon</h2>
                <img id="poke-sprite" src="" alt="">
                <div class="controls">
                    <button id="prev-btn">Previous</button>
                    <button id="next-btn">Next</button>
                </div>
            </div>
        </main>
    </div>

    <script src="Pokemon-API.js"></script>
</body>
</html>
